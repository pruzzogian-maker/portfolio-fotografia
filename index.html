<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Fotográfico | Deportes & Recitales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: #14171c;
      --accent: #ff4757;
      --accent-alt: #2ed573;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      background: rgba(10, 11, 14, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent);
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 28px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text-main);
    }

    /* PORTADA DIVIDIDA (SPLIT SCREEN) */
    .hero-split {
      display: flex;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    .split-side {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: flex 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .split-side:hover {
      flex: 1.35;
    }

    .split-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: brightness(0.45) grayscale(25%);
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s;
    }

    .split-side:hover .split-bg {
      transform: scale(1.06);
      filter: brightness(0.65) grayscale(0%);
    }

    .split-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
    }

    .split-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
    }
